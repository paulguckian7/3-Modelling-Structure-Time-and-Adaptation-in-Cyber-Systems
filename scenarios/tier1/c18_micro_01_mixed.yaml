id: c18_micro_01_mixed
spec_version: '0.1'
description: 'Eight-node micro-system. A vendor update server (external governance)
  supplies Execution Pathway to two hosts through a channel; a config server supplies
  Authority to three hosts through a control plane; a database is a dependency of
  two application hosts and is the sole supplier of X to app-2 (a Cut). Structural
  correspondence scenario: deterministic mode.

  '
